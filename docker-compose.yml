# Full worker stack: a scheduled trainer + an always-on inference server,
# sharing the data store and model registry through volumes.
# All ALLORA_* knobs fall through from your shell / .env (with defaults here).
x-env: &env
  ALLORA_DATA_DIR: /data
  ALLORA_MODELS_DIR: /models
  ALLORA_EXCHANGE: ${ALLORA_EXCHANGE:-binanceus}
  ALLORA_SYMBOL: ${ALLORA_SYMBOL:-BTC/USDT}
  ALLORA_CROSS_SYMBOL: ${ALLORA_CROSS_SYMBOL:-ETH/USDT}
  ALLORA_TIMEFRAME: ${ALLORA_TIMEFRAME:-5m}
  ALLORA_HORIZON_STEPS: ${ALLORA_HORIZON_STEPS:-12}
  ALLORA_USE_ORDERFLOW: ${ALLORA_USE_ORDERFLOW:-true}
  ALLORA_FUTURES_EXCHANGE: ${ALLORA_FUTURES_EXCHANGE:-binance}
  ALLORA_FUTURES_SYMBOL: ${ALLORA_FUTURES_SYMBOL:-}        # empty: futures off (hurt 1h DA)
  ALLORA_USE_CLASSIFIER: ${ALLORA_USE_CLASSIFIER:-true}
  ALLORA_USE_ENSEMBLE: ${ALLORA_USE_ENSEMBLE:-true}
  ALLORA_RECENCY_HALF_LIFE_DAYS: ${ALLORA_RECENCY_HALF_LIFE_DAYS:-45}
  ALLORA_TRAIN_WINDOW_DAYS: ${ALLORA_TRAIN_WINDOW_DAYS:-365}
  ALLORA_CALIBRATION_RATIO: ${ALLORA_CALIBRATION_RATIO:-}  # empty: search the ratio grid
  ALLORA_TOPIC_TOKEN: ${ALLORA_TOPIC_TOKEN:-BTC}
  ALLORA_RETRAIN_HOUR_UTC: ${ALLORA_RETRAIN_HOUR_UTC:-1}
  ALLORA_DUNE_API_KEY: ${ALLORA_DUNE_API_KEY:-}
  ALLORA_DUNE_EXECUTE: ${ALLORA_DUNE_EXECUTE:-false}
  ALLORA_DUNE_QUERY_STABLE_SUPPLY: ${ALLORA_DUNE_QUERY_STABLE_SUPPLY:-}
  ALLORA_DUNE_QUERY_CEX_NETFLOW: ${ALLORA_DUNE_QUERY_CEX_NETFLOW:-}
  ALLORA_DUNE_QUERY_DEX_VOLUME: ${ALLORA_DUNE_QUERY_DEX_VOLUME:-}
  ALLORA_DUNE_QUERY_ACTIVE_ADDR: ${ALLORA_DUNE_QUERY_ACTIVE_ADDR:-}
  ALLORA_ALERT_WEBHOOK: ${ALLORA_ALERT_WEBHOOK:-}

services:
  trainer:
    build:
      context: .
    image: allora-forge:latest
    command: ["python", "-m", "forge.pipeline", "--loop"]
    environment: *env
    volumes:
      - ./data:/data
      - ./models:/models
    restart: unless-stopped

  inference:
    image: allora-forge:latest
    command: ["uvicorn", "forge.server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *env
    volumes:
      - ./data:/data
      - ./models:/models
    ports:
      - "8000:8000"
    depends_on:
      - trainer
    restart: unless-stopped
